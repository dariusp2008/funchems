<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="./store-data.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: oklch(0.972 0.003 240); }
  * { box-sizing: border-box; }
  a { color: oklch(0.19 0.008 250); text-decoration: none; }
  a:hover { color: oklch(0.40 0.105 262); }
</style>
</helmet>
<div style="font-family: 'IBM Plex Sans', Helvetica, sans-serif; color: oklch(0.19 0.008 250); background: oklch(0.972 0.003 240); min-height: 100vh; -webkit-font-smoothing: antialiased;">

  <dc-import name="StoreChrome" active="" hint-size="100%,222px"></dc-import>

  <section style="max-width: 560px; margin: 0 auto; padding: 100px clamp(16px, 3.5vw, 40px) 130px; display: flex; flex-direction: column; gap: 18px;">

    <sc-if value="{{ checking }}" hint-placeholder-val="{{ false }}">
      <p style="font-size: 14px; color: oklch(0.5 0.008 250);">{{ checkingText }}</p>
    </sc-if>

    <sc-if value="{{ confirmed }}" hint-placeholder-val="{{ false }}">
      <span style="font-size: 12.5px; font-weight: 500; letter-spacing: 0; color: oklch(0.40 0.105 262);">{{ confirmedLabel }}</span>
      <h1 style="margin: 0; font-family: Archivo, Helvetica, sans-serif; font-size: 32px; line-height: 1.08; letter-spacing: -0.02em; font-weight: 600;">{{ welcomeHeading }}</h1>
      <p style="margin: 0; font-size: 14px; line-height: 1.65; color: oklch(0.48 0.008 250);">{{ confirmedBody }}</p>
      <div style="display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap;">
        <a href="Account.dc.html" style="display: flex; align-items: center; height: 46px; padding: 0 24px; border-radius: 2px; background: oklch(0.19 0.008 250); color: oklch(0.985 0.002 240); font-size: 13.5px; font-weight: 500;" style-hover="background: oklch(0.40 0.105 262); color: oklch(0.985 0.002 240);">{{ accountCta }}</a>
        <a href="Shop.dc.html" style="display: flex; align-items: center; height: 46px; padding: 0 24px; border: 1px solid oklch(0.85 0.006 250); border-radius: 2px; font-size: 13.5px; font-weight: 500;" style-hover="border-color: oklch(0.19 0.008 250);">{{ browseCta }}</a>
      </div>
    </sc-if>

    <sc-if value="{{ invalid }}" hint-placeholder-val="{{ false }}">
      <h1 style="margin: 0; font-family: Archivo, Helvetica, sans-serif; font-size: 28px; line-height: 1.1; letter-spacing: -0.02em; font-weight: 600;">{{ invalidHeading }}</h1>
      <p style="margin: 0; font-size: 14px; line-height: 1.6; color: oklch(0.48 0.008 250);">{{ invalidBody }}</p>
      <a href="Sign-In.dc.html" style="display: inline-flex; align-items: center; justify-content: center; height: 46px; padding: 0 26px; width: fit-content; border-radius: 2px; background: oklch(0.19 0.008 250); color: oklch(0.985 0.002 240); font-size: 13.5px; font-weight: 500;" style-hover="background: oklch(0.40 0.105 262);">{{ signInCta }}</a>
    </sc-if>

  </section>

  <dc-import name="SiteFooter" hint-size="100%,420px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1400,&quot;height&quot;:900}}">
const STR = {
  en: {
    checkingText: "Confirming…",
    confirmedLabel: "Account confirmed",
    welcomeHeading: (email) => `You're in, ${email}`,
    confirmedBody: "Your email is confirmed and you're signed in. Order history, lab reports and the weekly offsale vote are ready when you are.",
    accountCta: "Go to your account",
    browseCta: "Browse the catalogue",
    invalidHeading: "Nothing to confirm here",
    invalidBody: "This page only makes sense from a confirmation email link. If you already have an account, sign in below.",
    signInCta: "Go to sign in",
  },
  nl: {
    checkingText: "Bevestigen…",
    confirmedLabel: "Account bevestigd",
    welcomeHeading: (email) => `Welkom, ${email}`,
    confirmedBody: "Uw e-mailadres is bevestigd en u bent ingelogd. Bestelgeschiedenis, labrapporten en de wekelijkse afprijsstemming staan voor u klaar.",
    accountCta: "Naar uw account",
    browseCta: "Bekijk de catalogus",
    invalidHeading: "Niets te bevestigen hier",
    invalidBody: "Deze pagina is alleen bedoeld voor een link uit een bevestigingsmail. Heeft u al een account, log dan hieronder in.",
    signInCta: "Naar inloggen",
  },
};

class Component extends DCLogic {
  state = { phase: "checking", email: "" };

  componentDidMount() {
    const bind = () => { this.unsub = window.Funchems.subscribe(() => this.forceUpdate()); this.checkSession(); };
    if (window.Funchems) bind();
    else this.poll = setInterval(() => { if (window.Funchems) { clearInterval(this.poll); bind(); } }, 60);
  }
  componentWillUnmount() {
    if (this.unsub) this.unsub();
    if (this.poll) clearInterval(this.poll);
  }

  async checkSession() {
    const db = window.Funchems;
    const c = db.connect();
    if (!c) { this.setState({ phase: "invalid" }); return; }
    for (let i = 0; i < 10; i++) {
      const { data } = await c.auth.getSession();
      if (data.session) { this.setState({ phase: "confirmed", email: data.session.user.email }); return; }
      await new Promise((r) => setTimeout(r, 300));
    }
    this.setState({ phase: "invalid" });
  }

  renderVals() {
    const db = window.Funchems;
    const phase = this.state.phase;
    if (!db) {
      return {
        checking: phase === "checking",
        confirmed: phase === "confirmed",
        invalid: phase === "invalid",
        email: this.state.email,
        checkingText: STR.en.checkingText,
        confirmedLabel: STR.en.confirmedLabel,
        welcomeHeading: STR.en.welcomeHeading(this.state.email),
        confirmedBody: STR.en.confirmedBody,
        accountCta: STR.en.accountCta,
        browseCta: STR.en.browseCta,
        invalidHeading: STR.en.invalidHeading,
        invalidBody: STR.en.invalidBody,
        signInCta: STR.en.signInCta,
      };
    }
    const L = (k) => db.t(STR, k);
    return {
      checking: phase === "checking",
      confirmed: phase === "confirmed",
      invalid: phase === "invalid",
      email: this.state.email,
      checkingText: L("checkingText"),
      confirmedLabel: L("confirmedLabel"),
      welcomeHeading: L("welcomeHeading")(this.state.email),
      confirmedBody: L("confirmedBody"),
      accountCta: L("accountCta"),
      browseCta: L("browseCta"),
      invalidHeading: L("invalidHeading"),
      invalidBody: L("invalidBody"),
      signInCta: L("signInCta"),
    };
  }
}
</script>
</body>
</html>
