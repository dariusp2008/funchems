<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="./store-data.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: oklch(0.972 0.003 240); }
  * { box-sizing: border-box; }
  a { color: oklch(0.19 0.008 250); text-decoration: none; }
  a:hover { color: oklch(0.40 0.105 262); }
  input { font-family: inherit; }
  @keyframes marquee-left { from { transform: translate3d(0,0,0); } to { transform: translate3d(-50%,0,0); } }
</style>
</helmet>
<div style="font-family: 'IBM Plex Sans', Helvetica, sans-serif; color: oklch(0.19 0.008 250); background: oklch(0.972 0.003 240); min-height: 100vh; -webkit-font-smoothing: antialiased;">

  <dc-import name="StoreChrome" active="Shop" hint-size="100%,222px"></dc-import>

  <section style="max-width: 1400px; margin: 0 auto; padding: 34px clamp(16px, 3.5vw, 40px) 0;">
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding-bottom: 26px; border-bottom: 1px solid oklch(0.9 0.004 250); flex-wrap: wrap;">
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <span style="font-size: 12.5px; font-weight: 500; letter-spacing: 0; color: oklch(0.40 0.105 262);">Search</span>
        <h1 style="margin: 0; font-family: Archivo, Helvetica, sans-serif; font-size: 33px; line-height: 1.06; letter-spacing: -0.02em; font-weight: 600;">{{ heading }}</h1>
        <span style="font-size: 13.5px; color: oklch(0.5 0.008 250);">{{ countLine }}</span>
      </div>
      <div style="position: relative; width: 360px; max-width: 100%;">
        <input type="text" value="{{ query }}" onChange="{{ setQuery }}" placeholder="Search the catalogue" style="width: 100%; height: 46px; padding: 0 14px; border: 1px solid oklch(0.88 0.004 250); border-radius: 2px; background: oklch(0.985 0.002 240); font-size: 14px; outline: none;" style-focus="border-color: oklch(0.40 0.105 262);" />
      </div>
    </div>
  </section>

  <section style="max-width: 1400px; margin: 0 auto; padding: 32px clamp(16px, 3.5vw, 40px) 68px; display: flex; flex-direction: column; gap: 34px;">
    <sc-if value="{{ hasResults }}" hint-placeholder-val="{{ true }}">
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 20px;">
        <sc-for list="{{ results }}" as="p" hint-placeholder-count="8">
          <dc-import name="ProductCard" cat="{{ p.cat }}" hint-size="100%,404px"></dc-import>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 88px 20px; border: 1px dashed oklch(0.87 0.006 250);">
        <span style="font-family: Archivo, Helvetica, sans-serif; font-size: 30px; color: oklch(0.4 0.008 250);">Nothing matches “{{ query }}”</span>
        <span style="font-size: 13.5px; color: oklch(0.55 0.008 250);">Try a catalogue number like MK25, or browse everything.</span>
        <a href="Shop.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 24px; margin-top: 6px; border-radius: 2px; background: oklch(0.19 0.008 250); color: oklch(0.985 0.002 240); font-size: 13px; font-weight: 500; letter-spacing: 0;" style-hover="background: oklch(0.40 0.105 262); color: oklch(0.985 0.002 240);">All compounds</a>
      </div>
    </sc-if>

    <div style="display: flex; flex-direction: column; gap: 16px; padding-top: 8px; border-top: 1px solid oklch(0.9 0.004 250);">
      <span style="font-size: 12.5px; font-weight: 500; letter-spacing: 0; color: oklch(0.55 0.008 250);">Popular right now</span>
      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <sc-for list="{{ popular }}" as="p" hint-placeholder-count="6">
          <button onClick="{{ p.pick }}" style="height: 34px; padding: 0 14px; border: 1px solid oklch(0.89 0.004 250); border-radius: 2px; background: oklch(0.985 0.002 240); cursor: pointer; font-family: inherit; font-size: 12.5px; color: oklch(0.3 0.008 250);" style-hover="border-color: oklch(0.40 0.105 262); color: oklch(0.40 0.105 262);">{{ p.label }}</button>
        </sc-for>
      </div>
    </div>
  </section>

  <dc-import name="SiteFooter" hint-size="100%,420px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { query: "" };

  componentDidMount() {
    const bind = () => { this.unsub = window.Funchems.subscribe(() => this.forceUpdate()); this.forceUpdate(); };
    if (window.Funchems) bind();
    else this.poll = setInterval(() => { if (window.Funchems) { clearInterval(this.poll); bind(); } }, 60);
    const q = new URLSearchParams(window.location.search).get("q");
    if (q) this.setState({ query: q });
  }
  componentWillUnmount() {
    if (this.unsub) this.unsub();
    if (this.poll) clearInterval(this.poll);
  }

  renderVals() {
    const db = window.Funchems;
    if (!db) return { results: [], popular: [] };
    const q = this.state.query.trim();
    const hits = q ? db.products({ liveOnly: true, query: q }) : db.products({ liveOnly: true });
    const seen = {};
    const results = hits.filter((p) => (seen[p.name] ? false : (seen[p.name] = true)));
    return {
      heading: q ? "Results for “" + q + "”" : "Everything in the catalogue",
      countLine: results.length + (results.length === 1 ? " product" : " products") + ", prices already include every automatic offer",
      query: this.state.query,
      setQuery: (e) => this.setState({ query: e.target.value }),
      hasResults: results.length > 0,
      isEmpty: results.length === 0,
      results: results.map((p) => ({ cat: p.cat })),
      popular: ["Catalogue no.", "10 mg", "99% purity", "Lab tested"].map((label) => ({
        label,
        pick: () => this.setState({ query: label }),
      })),
    };
  }
}
</script>
</body>
</html>
