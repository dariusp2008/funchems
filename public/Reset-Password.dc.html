<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="./store-data.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: oklch(0.972 0.003 240); }
  * { box-sizing: border-box; }
  a { color: oklch(0.19 0.008 250); text-decoration: none; }
  a:hover { color: oklch(0.40 0.105 262); }
  input { font-family: inherit; }
</style>
</helmet>
<div style="font-family: 'IBM Plex Sans', Helvetica, sans-serif; color: oklch(0.19 0.008 250); background: oklch(0.972 0.003 240); min-height: 100vh; -webkit-font-smoothing: antialiased;">

  <dc-import name="StoreChrome" active="" hint-size="100%,222px"></dc-import>

  <section style="max-width: 520px; margin: 0 auto; padding: 90px clamp(16px, 3.5vw, 40px) 120px;">

    <sc-if value="{{ checking }}" hint-placeholder-val="{{ false }}">
      <p style="font-size: 14px; color: oklch(0.5 0.008 250);">Checking your reset link…</p>
    </sc-if>

    <sc-if value="{{ invalid }}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 14px;">
        <h1 style="margin: 0; font-family: Archivo, Helvetica, sans-serif; font-size: 28px; line-height: 1.1; letter-spacing: -0.02em; font-weight: 600;">Link expired or invalid</h1>
        <p style="margin: 0; font-size: 14px; line-height: 1.6; color: oklch(0.48 0.008 250);">Reset links expire after one hour and only work once. Request a new one.</p>
        <a href="Sign-In.dc.html" style="display: inline-flex; align-items: center; justify-content: center; height: 46px; padding: 0 26px; width: fit-content; border-radius: 2px; background: oklch(0.19 0.008 250); color: oklch(0.985 0.002 240); font-size: 13.5px; font-weight: 500;" style-hover="background: oklch(0.40 0.105 262);">Back to sign in</a>
      </div>
    </sc-if>

    <sc-if value="{{ ready }}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 22px; padding: 32px; background: oklch(0.985 0.002 240); border: 1px solid oklch(0.9 0.004 250);">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <h1 style="margin: 0; font-family: Archivo, Helvetica, sans-serif; font-size: 26px; line-height: 1.1; letter-spacing: -0.02em; font-weight: 600;">Set a new password</h1>
          <p style="margin: 0; font-size: 13.5px; line-height: 1.6; color: oklch(0.48 0.008 250);">Eight characters or more.</p>
        </div>

        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label style="font-size: 12.5px; font-weight: 500; color: oklch(0.5 0.008 250);">New password</label>
          <input type="password" value="{{ password }}" onChange="{{ setPassword }}" onKeyDown="{{ submitKey }}" autocomplete="new-password" style="width: 100%; height: 44px; padding: 0 13px; border: 1px solid oklch(0.88 0.004 250); border-radius: 2px; background: oklch(0.972 0.003 240); font-size: 14px; color: oklch(0.22 0.008 250); outline: none;" style-focus="border-color: oklch(0.40 0.105 262); background: oklch(0.985 0.002 240);" />
        </div>

        <sc-if value="{{ hasNote }}" hint-placeholder-val="{{ false }}">
          <div style="padding: 12px 14px; border-left: 2px solid {{ noteColor }}; background: oklch(0.972 0.003 240);">
            <span style="font-size: 13px; line-height: 1.55; color: {{ noteColor }};">{{ note }}</span>
          </div>
        </sc-if>

        <button onClick="{{ submit }}" style="display: flex; align-items: center; justify-content: center; height: 46px; padding: 0 26px; border: 0; border-radius: 2px; background: oklch(0.19 0.008 250); color: oklch(0.985 0.002 240); cursor: pointer; font-family: inherit; font-size: 13.5px; font-weight: 500;" style-hover="background: oklch(0.40 0.105 262);">{{ submitLabel }}</button>
      </div>
    </sc-if>

  </section>

  <dc-import name="SiteFooter" hint-size="100%,420px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1400,&quot;height&quot;:900}}">
class Component extends DCLogic {
  state = { phase: "checking", password: "", note: "", ok: false, done: false };

  componentDidMount() {
    const bind = () => this.checkSession();
    if (window.Funchems) bind();
    else this.poll = setInterval(() => { if (window.Funchems) { clearInterval(this.poll); bind(); } }, 60);
  }
  componentWillUnmount() { if (this.poll) clearInterval(this.poll); }

  async checkSession() {
    const db = window.Funchems;
    const c = db.connect();
    if (!c) { this.setState({ phase: "invalid" }); return; }
    // A recovery link lands here already carrying a valid (temporary) session —
    // give the client a moment to finish processing the URL fragment, then
    // check once. No session at all means the link was invalid or expired.
    for (let i = 0; i < 10; i++) {
      const { data } = await c.auth.getSession();
      if (data.session) { this.setState({ phase: "ready" }); return; }
      await new Promise((r) => setTimeout(r, 300));
    }
    this.setState({ phase: "invalid" });
  }

  async submit() {
    if (this.state.password.length < 8) {
      this.setState({ note: "Use at least eight characters.", ok: false });
      return;
    }
    const db = window.Funchems;
    const res = await db.auth.changePassword(this.state.password);
    if (!res.ok) { this.setState({ note: res.error, ok: false }); return; }
    this.setState({ note: "Password updated. Redirecting…", ok: true });
    setTimeout(() => { window.location.href = "Account.dc.html"; }, 1200);
  }

  renderVals() {
    const phase = this.state.phase;
    return {
      checking: phase === "checking",
      invalid: phase === "invalid",
      ready: phase === "ready",
      password: this.state.password,
      setPassword: (e) => this.setState({ password: e.target.value, note: "" }),
      submit: () => this.submit(),
      submitKey: (e) => { if (e.key === "Enter") this.submit(); },
      submitLabel: "Set new password",
      hasNote: Boolean(this.state.note),
      note: this.state.note,
      noteColor: this.state.ok ? "oklch(0.42 0.10 145)" : "oklch(0.5 0.13 27)",
    };
  }
}
</script>
</body>
</html>
