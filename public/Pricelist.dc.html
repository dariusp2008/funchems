<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="./store-data.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: oklch(0.972 0.003 240); }
  * { box-sizing: border-box; }
  a { color: oklch(0.19 0.008 250); text-decoration: none; }
  a:hover { color: oklch(0.40 0.105 262); }
  input { font-family: inherit; }
  @keyframes marquee-left { from { transform: translate3d(0,0,0); } to { transform: translate3d(-50%,0,0); } }
</style>
</helmet>
<div style="font-family: 'IBM Plex Sans', Helvetica, sans-serif; color: oklch(0.19 0.008 250); background: oklch(0.972 0.003 240); min-height: 100vh; -webkit-font-smoothing: antialiased;">

  <dc-import name="StoreChrome" active="Pricelist" hint-size="100%,222px"></dc-import>

  <section style="max-width: 1400px; margin: 0 auto; padding: 34px clamp(16px, 3.5vw, 40px) 0;">
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 56px; align-items: end; padding-bottom: 28px; border-bottom: 1px solid oklch(0.9 0.004 250);">
      <div style="display: flex; flex-direction: column; gap: 14px;">
        <span style="font-size: 12.5px; font-weight: 500; letter-spacing: 0; color: oklch(0.40 0.105 262);">{{ updated }}</span>
        <h1 style="margin: 0; font-family: Archivo, Helvetica, sans-serif; font-size: 48px; line-height: 1; letter-spacing: -0.02em; font-weight: 600;">Full pricelist</h1>
        <p style="margin: 0; max-width: 62ch; font-size: 14px; line-height: 1.65; color: oklch(0.46 0.008 250); text-wrap: pretty;">{{ intro }}</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px; padding: 2px 0 2px 22px; border-left: 1px solid oklch(0.86 0.006 250);">
        <span style="font-size: 12.5px; font-weight: 500; letter-spacing: 0; color: oklch(0.55 0.008 250);">Tier structure</span>
        <div style="display: flex; flex-direction: column; gap: 7px; font-size: 13px; color: oklch(0.3 0.008 250);">
          <sc-for list="{{ tiers }}" as="t" hint-placeholder-count="3">
            <span style="display: flex; justify-content: space-between;"><span>{{ t.range }}</span><span style="color: {{ t.color }};">{{ t.label }}</span></span>
          </sc-for>
        </div>
        <span style="margin-top: 4px; font-size: 12px; line-height: 1.5; color: oklch(0.55 0.008 250);">{{ tierNote }}</span>
      </div>
    </div>
  </section>

  <section style="max-width: 1400px; margin: 0 auto; padding: 30px clamp(16px, 3.5vw, 40px) 68px;">
    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 22px; flex-wrap: wrap;">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
        <button onClick="{{ t.pick }}" style="height: 36px; padding: 0 16px; border: 1px solid {{ t.border }}; border-radius: 2px; background: {{ t.bg }}; color: {{ t.color }}; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 500; letter-spacing: 0;" style-hover="border-color: oklch(0.40 0.105 262);">{{ t.label }}</button>
      </sc-for>
      <div style="position: relative; margin-left: auto; width: 260px;">
        <input type="text" value="{{ query }}" onChange="{{ setQuery }}" placeholder="Filter by cat. no. or name" style="width: 100%; height: 36px; padding: 0 12px; border: 1px solid oklch(0.88 0.004 250); border-radius: 2px; background: oklch(0.985 0.002 240); font-size: 13px; outline: none;" style-focus="border-color: oklch(0.40 0.105 262);" />
      </div>
    </div>

    <div style="border-top: 2px solid oklch(0.19 0.008 250); overflow-x: auto;">
      <div style="display: grid; grid-template-columns: {{ gridCols }}; gap: 0; min-width: 1020px; border-bottom: 1px solid oklch(0.86 0.006 250);">
        <sc-for list="{{ headers }}" as="h" hint-placeholder-count="8">
          <span style="padding: 11px 8px 11px 0; font-size: 12.5px; font-weight: 500; letter-spacing: 0; color: oklch(0.5 0.008 250); text-align: {{ h.align }};">{{ h.label }}</span>
        </sc-for>
      </div>
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="14">
        <div style="display: grid; grid-template-columns: {{ gridCols }}; gap: 0; min-width: 1020px; border-bottom: 1px solid oklch(0.93 0.004 250); align-items: center;" style-hover="background: oklch(0.985 0.002 240);">
          <span style="padding: 11px 8px 11px 0; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: oklch(0.45 0.008 250);">{{ r.cat }}</span>
          <a href="{{ r.href }}" style="padding: 11px 8px 11px 0; font-size: 14px; font-weight: 500; min-width: 0;">{{ r.name }}</a>
          <span style="padding: 11px 8px 11px 0; font-size: 13px; color: oklch(0.45 0.008 250);">{{ r.dose }}</span>
          <sc-for list="{{ r.prices }}" as="pc" hint-placeholder-count="3">
            <span style="padding: 11px 8px 11px 0; font-size: 13.5px; text-align: right; color: {{ pc.color }};">{{ pc.value }}</span>
          </sc-for>
          <span style="padding: 11px 8px 11px 0; font-size: 12.5px; text-align: right; color: {{ r.stockColor }};">{{ r.stock }}</span>
          <span style="padding: 7px 0 7px 12px; display: flex; justify-content: flex-end;">
            <button onClick="{{ r.add }}" style="display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border: 1px solid {{ r.btnBorder }}; border-radius: 2px; background: {{ r.btnBg }}; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 500; letter-spacing: 0; color: {{ r.btnColor }};" style-hover="background: oklch(0.19 0.008 250); border-color: oklch(0.19 0.008 250); color: oklch(0.985 0.002 240);">{{ r.btnLabel }}</button>
          </span>
        </div>
      </sc-for>
      <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 56px 20px;">
          <span style="font-family: Archivo, Helvetica, sans-serif; font-size: 22px; color: oklch(0.45 0.008 250);">Nothing matches that filter</span>
        </div>
      </sc-if>
    </div>

    <div style="display: flex; align-items: center; gap: 28px; margin-top: 22px; font-size: 12.5px; color: oklch(0.5 0.008 250); flex-wrap: wrap;">
      <span style="display: flex; align-items: center; gap: 8px;"><span style="width: 6px; height: 6px; background: oklch(0.55 0.13 145); border-radius: 50%; display: block;"></span>In stock, ships today</span>
      <span style="display: flex; align-items: center; gap: 8px;"><span style="width: 6px; height: 6px; background: oklch(0.7 0.12 75); border-radius: 50%; display: block;"></span>Low stock</span>
      <span style="display: flex; align-items: center; gap: 8px;"><span style="width: 6px; height: 6px; background: oklch(0.72 0.006 250); border-radius: 50%; display: block;"></span>Restocking</span>
      <span style="margin-left: auto; font-size: 12.5px; color: oklch(0.55 0.008 250);">{{ footNote }}</span>
    </div>
  </section>

  <dc-import name="SiteFooter" hint-size="100%,540px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { tab: 0, query: "", added: null };

  componentDidMount() {
    const bind = () => { this.unsub = window.Funchems.subscribe(() => this.forceUpdate()); this.forceUpdate(); };
    if (window.Funchems) bind();
    else this.poll = setInterval(() => { if (window.Funchems) { clearInterval(this.poll); bind(); } }, 60);
  }
  componentWillUnmount() {
    if (this.unsub) this.unsub();
    if (this.poll) clearInterval(this.poll);
    if (this.t) clearTimeout(this.t);
  }

  renderVals() {
    const db = window.Funchems;
    if (!db) return { rows: [], tabs: [], headers: [], tiers: [], gridCols: "108px minmax(190px, 1fr) 118px 108px 108px 108px 100px 132px" };
    const all = db.products({ liveOnly: true });
    const catList = db.categories({ liveOnly: true });
    const cats = [null].concat(catList.map((c) => c.slug));
    const tab = Math.min(this.state.tab, cats.length - 1);
    const cat = cats[tab];
    const q = this.state.query.trim().toLowerCase();
    const rows = all.filter((p) => (!cat || p.category === cat) && (!q || (p.name + " " + p.cat).toLowerCase().includes(q)));
    const cryptoOff = Number(db.data.settings.cryptoDiscount) || 0;
    const qt = db.qtyTiers();

    return {
      updated: "Updated " + new Date().toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" }),
      intro: "Every catalogue number with tiered unit pricing. Tiers apply per line, mix freely across the order. Crypto payment takes a further " + cryptoOff + "% off the total at checkout.",
      tiers: qt.map((t) => ({
        range: t.label || Number(t.minQty) + "+ kits",
        label: Number(t.off) > 0 ? "−" + t.off + "%" : "list price",
        color: Number(t.off) > 0 ? "oklch(0.40 0.105 262)" : "oklch(0.5 0.008 250)",
      })),
      tierNote: db.data.content.tierNote || "",

      tabs: [{ label: "All " + all.length, i: 0 }].concat(catList.map((c, i) => ({
        label: c.label + " " + all.filter((p) => p.category === c.slug).length, i: i + 1,
      }))).map((t) => ({
        label: t.label,
        pick: () => this.setState({ tab: t.i }),
        bg: t.i === tab ? "oklch(0.19 0.008 250)" : "oklch(0.985 0.002 240)",
        color: t.i === tab ? "oklch(0.985 0.002 240)" : "oklch(0.35 0.008 250)",
        border: t.i === tab ? "oklch(0.19 0.008 250)" : "oklch(0.88 0.004 250)",
      })),
      query: this.state.query,
      setQuery: (e) => this.setState({ query: e.target.value }),

      headers: [
        { label: "Cat. no.", align: "left" },
        { label: "Compound", align: "left" },
        { label: "Dosage", align: "left" },
      ].concat(qt.map((t) => ({ label: t.label || Number(t.minQty) + "+", align: "right" })))
        .concat([{ label: "Stock", align: "right" }, { label: "", align: "right" }]),
      gridCols: "108px minmax(190px, 1fr) 118px " + qt.map(() => "108px").join(" ") + " 100px 132px",
      isEmpty: rows.length === 0,
      rows: rows.map((p) => {
        const unit = db.effectivePrice(p);
        const state = db.stockLabel(p);
        const out = p.stock <= 0;
        const justAdded = this.state.added === p.cat;
        return {
          cat: p.cat, name: p.name, dose: p.dose,
          href: "Product-Detail.dc.html?p=" + p.cat,
          prices: qt.map((t) => ({ value: db.money(db.tierPrice(p, t.minQty)), color: Number(t.off) > 0 ? "oklch(0.40 0.105 262)" : "oklch(0.25 0.008 250)" })),
          stock: out ? "Restocking" : state.tone === "low" ? "Low, " + p.stock : "In stock",
          stockColor: out ? "oklch(0.62 0.006 250)" : state.tone === "low" ? "oklch(0.55 0.12 75)" : "oklch(0.45 0.11 145)",
          btnLabel: out ? "Notify" : justAdded ? "Added" : "Add",
          btnBg: justAdded ? "oklch(0.19 0.008 250)" : "transparent",
          btnColor: justAdded ? "oklch(0.985 0.002 240)" : "oklch(0.3 0.008 250)",
          btnBorder: justAdded ? "oklch(0.19 0.008 250)" : "oklch(0.85 0.006 250)",
          add: () => {
            if (out) return;
            db.cart.add(p.cat, 1);
            this.setState({ added: p.cat });
            if (this.t) clearTimeout(this.t);
            this.t = setTimeout(() => this.setState({ added: null }), 1400);
          },
        };
      }),
      footNote: rows.length + " of " + all.length + " lines shown",
    };
  }
}
</script>
</body>
</html>
