<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="./store-data.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: oklch(0.972 0.003 240); }
  * { box-sizing: border-box; }
  a { color: oklch(0.19 0.008 250); text-decoration: none; }
  a:hover { color: oklch(0.40 0.105 262); }
  input { font-family: inherit; }
  @keyframes marquee-left { from { transform: translate3d(0,0,0); } to { transform: translate3d(-50%,0,0); } }
</style>
</helmet>
<div style="font-family: 'IBM Plex Sans', Helvetica, sans-serif; color: oklch(0.19 0.008 250); background: oklch(0.972 0.003 240); min-height: 100vh; -webkit-font-smoothing: antialiased;">

  <dc-import name="StoreChrome" active="" hint-size="100%,222px"></dc-import>

  <section style="max-width: 1400px; margin: 0 auto; padding: 44px clamp(16px, 3.5vw, 40px) 72px; display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-start;">

    <div style="flex: 1 1 420px; min-width: 0; max-width: 520px; display: flex; flex-direction: column; gap: 22px; padding: 32px; background: oklch(0.985 0.002 240); border: 1px solid oklch(0.9 0.004 250);">
      <div style="display: flex; gap: 2px; padding: 3px; background: oklch(0.96 0.003 240); border: 1px solid oklch(0.91 0.004 250);">
        <sc-for list="{{ modes }}" as="m" hint-placeholder-count="3">
          <button onClick="{{ m.pick }}" style="flex: 1; height: 36px; border: 0; background: {{ m.bg }}; color: {{ m.color }}; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 500;">{{ m.label }}</button>
        </sc-for>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <h1 style="margin: 0; font-family: Archivo, Helvetica, sans-serif; font-size: 28px; line-height: 1.1; letter-spacing: -0.02em; font-weight: 600;">{{ title }}</h1>
        <p style="margin: 0; font-size: 13.5px; line-height: 1.6; color: oklch(0.48 0.008 250); text-wrap: pretty;">{{ blurb }}</p>
      </div>

      <div style="display: flex; flex-direction: column; gap: 14px;">
        <sc-for list="{{ fields }}" as="f" hint-placeholder-count="2">
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <label style="font-size: 12.5px; font-weight: 500; color: oklch(0.5 0.008 250);">{{ f.label }}</label>
            <input type="{{ f.type }}" value="{{ f.value }}" onChange="{{ f.change }}" onKeyDown="{{ submitKey }}" placeholder="{{ f.placeholder }}" autocomplete="{{ f.autocomplete }}" style="width: 100%; height: 44px; padding: 0 13px; border: 1px solid oklch(0.88 0.004 250); border-radius: 2px; background: oklch(0.972 0.003 240); font-size: 14px; color: oklch(0.22 0.008 250); outline: none;" style-focus="border-color: oklch(0.40 0.105 262); background: oklch(0.985 0.002 240);" />
            <span style="font-size: 12px; color: oklch(0.58 0.008 250);">{{ f.hint }}</span>
          </div>
        </sc-for>
      </div>

      <sc-if value="{{ hasNote }}" hint-placeholder-val="{{ false }}">
        <div style="padding: 12px 14px; border-left: 2px solid {{ noteColor }}; background: oklch(0.972 0.003 240);">
          <span style="font-size: 13px; line-height: 1.55; color: {{ noteColor }};">{{ note }}</span>
        </div>
      </sc-if>

      <div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap;">
        <button onClick="{{ submit }}" style="display: flex; align-items: center; justify-content: center; height: 46px; padding: 0 26px; border: 0; border-radius: 2px; background: oklch(0.19 0.008 250); color: oklch(0.985 0.002 240); cursor: pointer; font-family: inherit; font-size: 13.5px; font-weight: 500;" style-hover="background: oklch(0.40 0.105 262);">{{ submitLabel }}</button>
        <button onClick="{{ toggleReset }}" style="height: 46px; padding: 0 4px; border: 0; background: transparent; cursor: pointer; font-family: inherit; font-size: 13px; color: oklch(0.45 0.008 250); text-decoration: underline; text-underline-offset: 3px;" style-hover="color: oklch(0.40 0.105 262);">{{ altLabel }}</button>
      </div>
    </div>

    <div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 0; border-top: 1px solid oklch(0.9 0.004 250);">
      <sc-for list="{{ perks }}" as="p" hint-placeholder-count="4">
        <div style="display: grid; grid-template-columns: minmax(0, 1fr); padding: 18px 2px; border-bottom: 1px solid oklch(0.93 0.004 250);">
          <span style="display: flex; flex-direction: column; gap: 4px;">
            <span style="font-size: 14px; font-weight: 500;">{{ p.title }}</span>
            <span style="font-size: 13px; line-height: 1.6; color: oklch(0.48 0.008 250); text-wrap: pretty;">{{ p.body }}</span>
          </span>
        </div>
      </sc-for>
    </div>
  </section>

  <dc-import name="SiteFooter" hint-size="100%,420px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1400,&quot;height&quot;:900}}">
const STR = {
  en: {
    modeLabels: ["Sign in", "Create account", "Reset password"],
    title: ["Sign in", "Create an account", "Reset your password"],
    blurb: [
      "Your order history, saved compounds and stored payment methods live behind this.",
      "One account covers ordering, lab report access and the weekly offsale vote.",
      "Enter the address on the account and we will send a reset link.",
    ],
    emailLabel: "Email",
    emailPlaceholder: "youremail@email.com",
    passwordLabel: "Password",
    nameLabel: "Name or institution",
    namePlaceholder: "M. Reinholt",
    countryLabel: "Country",
    countryPlaceholder: "Norway",
    countryHint: "Used to price cold chain shipping.",
    signUpEmailHint: "Order updates and lab reports go here.",
    passwordHint: "Eight characters or more.",
    resetEmailHint: "We send a reset link that expires in an hour.",
    submitLabel: ["Sign in", "Create account", "Send reset link"],
    altLabel: ["Forgotten your password?", "Back to sign in"],
    done: "Done.",
    perks: [
      { title: "Order history and reorder", body: "Every order keeps its lot numbers, so a repeat order is one click." },
      { title: "Saved wallets", body: "Save the wallet address you pay from and reuse it at checkout." },
      { title: "Lab report access", body: "New assays for compounds you have bought arrive by email." },
      { title: "The weekly vote", body: "Account holders pick the compound that drops to half price." },
    ],
    errors: {
      "No account uses that email address.": "No account uses that email address.",
      "That password does not match our records.": "That password does not match our records.",
      "Enter a valid email address.": "Enter a valid email address.",
      "Use at least eight characters for the password.": "Use at least eight characters for the password.",
      "That email already has an account. Sign in instead.": "That email already has an account. Sign in instead.",
      "Invalid login credentials": "That email and password combination does not match our records.",
    },
    notes: {
      "Check your email to confirm your account.": "Check your email to confirm your account.",
      "It expires in one hour.": "It expires in one hour.",
      "if an account exists.": "if an account exists.",
      "Reset link sent to ": "Reset link sent to ",
    },
  },
  nl: {
    modeLabels: ["Inloggen", "Account aanmaken", "Wachtwoord resetten"],
    title: ["Inloggen", "Een account aanmaken", "Uw wachtwoord resetten"],
    blurb: [
      "Uw bestelgeschiedenis, opgeslagen verbindingen en betaalmethoden vindt u hierachter.",
      "Met één account bestelt u, krijgt u toegang tot labrapporten en stemt u mee over de wekelijkse afprijsactie.",
      "Vul het adres van uw account in en wij sturen u een resetlink.",
    ],
    emailLabel: "E-mail",
    emailPlaceholder: "uwemail@email.com",
    passwordLabel: "Wachtwoord",
    nameLabel: "Naam of instelling",
    namePlaceholder: "M. Reinholt",
    countryLabel: "Land",
    countryPlaceholder: "Noorwegen",
    countryHint: "Wordt gebruikt om de koelketenverzending te berekenen.",
    signUpEmailHint: "Bestelupdates en labrapporten komen hier binnen.",
    passwordHint: "Acht tekens of meer.",
    resetEmailHint: "Wij sturen een resetlink die na een uur verloopt.",
    submitLabel: ["Inloggen", "Account aanmaken", "Resetlink versturen"],
    altLabel: ["Wachtwoord vergeten?", "Terug naar inloggen"],
    done: "Gereed.",
    perks: [
      { title: "Bestelgeschiedenis en opnieuw bestellen", body: "Elke bestelling bewaart de lotnummers, zodat een herbestelling één klik is." },
      { title: "Opgeslagen wallets", body: "Sla het walletadres op waarmee u betaalt en gebruik het opnieuw bij het afrekenen." },
      { title: "Toegang tot labrapporten", body: "Nieuwe analyses voor verbindingen die u heeft gekocht, ontvangt u per e-mail." },
      { title: "De wekelijkse stemming", body: "Accounthouders bepalen welke verbinding naar de halve prijs gaat." },
    ],
    errors: {
      "No account uses that email address.": "Er is geen account met dit e-mailadres.",
      "That password does not match our records.": "Dit wachtwoord komt niet overeen met onze gegevens.",
      "Enter a valid email address.": "Vul een geldig e-mailadres in.",
      "Use at least eight characters for the password.": "Gebruik minstens acht tekens voor het wachtwoord.",
      "That email already has an account. Sign in instead.": "Dit e-mailadres heeft al een account. Log in plaats daarvan in.",
      "Invalid login credentials": "Deze combinatie van e-mailadres en wachtwoord komt niet overeen met onze gegevens.",
    },
    notes: {
      "Check your email to confirm your account.": "Controleer uw e-mail om uw account te bevestigen.",
      "It expires in one hour.": "Deze verloopt na een uur.",
      "if an account exists.": "als er een account bestaat.",
      "Reset link sent to ": "Resetlink verzonden naar ",
    },
  },
};

class Component extends DCLogic {
  state = { mode: 0, email: "", password: "", name: "", country: "", note: "", ok: false };

  componentDidMount() {
    const bind = () => { this.unsub = window.Funchems.subscribe(() => this.forceUpdate()); this.forceUpdate(); };
    if (window.Funchems) bind();
    else this.poll = setInterval(() => { if (window.Funchems) { clearInterval(this.poll); bind(); } }, 60);
  }
  componentWillUnmount() {
    if (this.unsub) this.unsub();
    if (this.poll) clearInterval(this.poll);
  }

  translateMessage(raw, isError) {
    const db = window.Funchems;
    if (!raw) return raw;
    const dict = isError ? db.t(STR, "errors") : db.t(STR, "notes");
    if (dict[raw]) return dict[raw];
    if (!isError) {
      const prefix = "Reset link sent to ";
      if (raw.indexOf(prefix) === 0) {
        const rest = raw.slice(prefix.length);
        const translatedRest = rest
          .replace("if an account exists.", dict["if an account exists."])
          .replace("It expires in one hour.", dict["It expires in one hour."]);
        return dict["Reset link sent to "] + translatedRest;
      }
    }
    return raw;
  }

  async go() {
    const db = window.Funchems;
    const m = this.state.mode;
    let res;
    if (m === 0) res = await db.auth.signIn(this.state.email, this.state.password);
    else if (m === 1) res = await db.auth.signUp({ email: this.state.email, password: this.state.password, name: this.state.name, country: this.state.country });
    else res = await db.auth.resetPassword(this.state.email);

    if (res.ok && m === 0) { window.location.href = "Account.dc.html"; return; }
    const note = res.ok
      ? this.translateMessage(res.note, false) || db.t(STR, "done")
      : this.translateMessage(res.error, true);
    this.setState({ note, ok: Boolean(res.ok) });
  }

  renderVals() {
    const db = window.Funchems;
    const L = (k) => db.t(STR, k);
    const m = this.state.mode;
    const f = (key, label, type, placeholder, hint, autocomplete) => ({
      label, type, placeholder, hint: hint || "", autocomplete: autocomplete || "on",
      value: this.state[key],
      change: (e) => this.setState({ [key]: e.target.value, note: "" }),
    });

    const fields = m === 0
      ? [f("email", L("emailLabel"), "email", L("emailPlaceholder"), "", "email"), f("password", L("passwordLabel"), "password", "", "", "current-password")]
      : m === 1
        ? [
          f("name", L("nameLabel"), "text", L("namePlaceholder"), "", "name"),
          f("email", L("emailLabel"), "email", L("emailPlaceholder"), L("signUpEmailHint"), "email"),
          f("country", L("countryLabel"), "text", L("countryPlaceholder"), L("countryHint"), "country-name"),
          f("password", L("passwordLabel"), "password", "", L("passwordHint"), "new-password"),
        ]
        : [f("email", L("emailLabel"), "email", L("emailPlaceholder"), L("resetEmailHint"), "email")];

    return {
      modes: L("modeLabels").map((label, i) => ({
        label,
        pick: () => this.setState({ mode: i, note: "" }),
        bg: i === m ? "oklch(0.985 0.002 240)" : "transparent",
        color: i === m ? "oklch(0.19 0.008 250)" : "oklch(0.52 0.008 250)",
      })),
      title: L("title")[m],
      blurb: L("blurb")[m],
      fields,
      submit: () => this.go(),
      submitKey: (e) => { if (e.key === "Enter") this.go(); },
      submitLabel: L("submitLabel")[m],
      altLabel: m === 0 ? L("altLabel")[0] : L("altLabel")[1],
      toggleReset: () => this.setState({ mode: m === 0 ? 2 : 0, note: "" }),
      hasNote: Boolean(this.state.note),
      note: this.state.note,
      noteColor: this.state.ok ? "oklch(0.42 0.10 145)" : "oklch(0.5 0.13 27)",
      perks: L("perks"),
    };
  }
}
</script>
</body>
</html>
